name: Bug report
description: Report a reproducible SELMA Labs defect.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove secrets, private media, and personal paths before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability. I will use private vulnerability reporting for security findings.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and which part of the workflow is affected?
      placeholder: A clear and concise description of the defect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Run ...
        2. Approve ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, FFmpeg, Node, GPU, provider, model, and relevant commit.
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or evidence
      description: Paste only the relevant output after removing credentials, private paths, and identifying data.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, output samples, or other useful context when safe to share.
