name: Quality Gates

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-real-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install quality-gate dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run offline application smoke test
        run: python scripts/verify_pipeline.py
      - name: Render and inspect a real MP4
        run: python scripts/render_smoke_test.py
      - name: Ensure CI created no untracked source files
        run: python scripts/audit_workspace_tracking.py --fail-on-untracked-source

  remotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Install locked Remotion dependencies
        run: npm ci
      - name: Type-check Remotion
        run: npm run typecheck
      - name: Render a real Remotion frame
        run: npm run smoke:still
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remotion-smoke-frame
          path: motion/remotion-smoke.png
          if-no-files-found: error
