name: Quality Gates

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install static-analysis tools
        run: python -m pip install "ruff>=0.16.0" "mypy>=1.11.0"
      - name: Ruff correctness gate
        run: python -m ruff check .
      - name: Mypy (advisory until the baseline is clean)
        continue-on-error: true
        run: python -m mypy core config cli

  a9-windows-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install contract-test dependencies
        run: python -m pip install "pytest>=8.0.0" "pytest-asyncio>=0.24.0"
      - name: Validate A9 contracts on Windows
        run: >-
          python -m pytest -q
          tests/test_blender_binary_resolver.py
          tests/test_blender_rig_adapter.py
          tests/test_character_rig_entities.py
          tests/test_domain_exceptions.py
          tests/test_rig_acting_builder.py
          tests/test_rig_validation_service.py

  python-and-real-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # 3.10 is the documented baseline; 3.11 is the compatibility signal ahead
      # of the 3.10 end-of-life. The real FFmpeg/smoke steps stay on the baseline
      # so the heavier render pipeline is not run twice per PR.
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install quality-gate dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run offline application smoke test
        if: matrix.python-version == '3.10'
        run: python scripts/verify_pipeline.py
      - name: Render and inspect a real MP4
        if: matrix.python-version == '3.10'
        run: python scripts/render_smoke_test.py
      - name: Ensure CI created no untracked source files
        if: matrix.python-version == '3.10'
        run: python scripts/audit_workspace_tracking.py --fail-on-untracked-source

  remotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Install locked Remotion dependencies
        run: npm ci
      - name: Type-check Remotion
        run: npm run typecheck
      - name: Render a real Remotion frame
        run: npm run smoke:still
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remotion-smoke-frame
          path: motion/remotion-smoke.png
          if-no-files-found: error
