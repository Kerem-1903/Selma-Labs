version: 2

updates:
  - package-ecosystem: pip
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    # Python requirements intentionally use compatible lower bounds instead of
    # a lock file. Disable routine minimum-version bump PRs; Dependabot security
    # updates remain enabled and are not counted against this limit.
    open-pull-requests-limit: 0
    rebase-strategy: auto
    commit-message:
      prefix: deps(python)
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /motion
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps(motion)
    groups:
      motion-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Remotion's current toolchain does not type-check with TypeScript 7 yet.
      # Keep receiving compatible minor/patch updates and revisit this at the
      # next Remotion major upgrade.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps(actions)
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
