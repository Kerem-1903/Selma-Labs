[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "performance: performance and benchmark tests",
    "blender_integration: tests that require a local Blender installation",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Ratchet stage 2: correctness, pyflakes, import order, pyupgrade, blind-except
# guards and bugbear. The tree is clean at this level, so the gate blocks on it;
# the remaining stages (simplify, bandit, raise-from, zip-strict, mypy) are
# recorded in docs/CODE_REVIEW.md.
select = ["B", "E4", "E9", "E722", "F", "I", "S110", "S112", "UP"]
# B008: FastAPI/typer-style call defaults are intentional in this codebase.
# B904: bare re-raises are reviewed by hand per site rather than mass-edited.
# B905: zip() length contracts need per-call judgement, not a blanket strict=.
ignore = ["B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
# Package inits exist to re-export; that is a use, not a dead import.
"__init__.py" = ["F401"]
# Diagnostic scripts extend sys.path before importing project code by design.
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# The blocking gate covers the domain, application, composition, adapter and
# entry-point layers. ``follow_imports = silent`` still uses imported types at
# call sites without reporting third-party package internals.
files = ["core", "infrastructure", "config", "cli"]
follow_imports = "silent"

