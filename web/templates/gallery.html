<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELMA Dream Machine - Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0a0a',
                        darker: '#050505',
                        glass: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: theme('colors.darker'); color: white; }
        .glass-panel {
            background: theme('colors.glass');
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid theme('colors.glassBorder');
        }
        .gradient-text {
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen font-sans selection:bg-indigo-500/30">

    <!-- Top Navigation -->
    <nav class="w-full px-6 py-4 flex items-center justify-between border-b border-white/5 z-50 bg-darker/80 backdrop-blur-md sticky top-0">
        <a href="/" class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600"></div>
            <span class="text-xl font-bold tracking-tight">SELMA <span class="font-light text-gray-400">Gallery</span></span>
        </a>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 relative z-10">
        <div class="mb-10">
            <h1 class="text-4xl font-semibold mb-2">My Projects</h1>
            <p class="text-gray-400">View and manage your previously generated cinematic videos.</p>
        </div>

        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Items will be injected here via JS -->
            <div class="col-span-full flex justify-center py-20">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500"></div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('gallery-grid');

            try {
                const response = await fetch('/api/gallery');
                const data = await response.json();

                if (data.runs && data.runs.length > 0) {
                    grid.innerHTML = ''; // clear loader

                    // Sort by newest first
                    data.runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                    data.runs.forEach(run => {
                        const statusColor = run.status === 'COMPLETED' ? 'text-green-400' :
                                           (run.status === 'FAILED' ? 'text-red-400' : 'text-blue-400');

                        const videoLink = run.status === 'COMPLETED' ?
                            `<a href="/workspace/${run.run_id}" class="mt-4 block w-full py-2 bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/30 text-indigo-300 text-center rounded-lg transition-colors text-sm font-medium">View in Workspace</a>` :
                            `<a href="/workspace/${run.run_id}" class="mt-4 block w-full py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-center rounded-lg transition-colors text-sm font-medium">Check Status</a>`;

                        const card = document.createElement('div');
                        card.className = 'glass-panel rounded-2xl p-5 flex flex-col h-full hover:border-gray-600 transition-colors duration-300';
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-xs font-mono text-gray-500 truncate mr-2" title="${run.run_id}">${run.run_id.substring(0,8)}...</span>
                                <span class="text-xs font-bold px-2 py-1 bg-black/40 rounded-full border border-white/5 ${statusColor}">${run.status}</span>
                            </div>

                            <div class="flex-grow">
                                <p class="text-sm text-gray-300 mb-2">
                                    <span class="text-gray-500 text-xs uppercase tracking-wider block mb-1">Created</span>
                                    ${new Date(run.created_at).toLocaleString()}
                                </p>
                            </div>

                            ${videoLink}
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = `
                        <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-500">
                            <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                            <p class="text-lg">No projects found.</p>
                            <a href="/" class="mt-4 text-indigo-400 hover:text-indigo-300">Create your first video</a>
                        </div>
                    `;
                }
            } catch (error) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-red-400">
                        <p class="text-lg">Failed to load gallery data.</p>
                        <p class="text-sm opacity-70 mt-2">${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
