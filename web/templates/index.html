<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELMA Dream Machine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        .gradient-text {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .shimmer {
            animation: shimmer 2s linear infinite;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        #drop-zone.dragover { border-color: #4facfe; background: rgba(79, 172, 254, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <!-- Background Ambient Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-blue-600/20 rounded-full blur-[120px] -z-10 pointer-events-none"></div>

    <!-- Header -->
    <div class="absolute top-6 left-8 flex items-center gap-3 w-full justify-between pr-16">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-gradient-to-tr from-blue-500 to-purple-600"></div>
            <h1 class="text-xl font-bold tracking-tight">SELMA <span class="text-gray-400 font-light">Dream Machine</span></h1>
        </div>

        <!-- Header Controls -->
        <div class="hidden md:flex gap-6 items-center">
        <!-- Autopilot Controls -->
        <div class="glass-panel px-4 py-2 rounded-full text-sm flex items-center gap-3">
            <span class="text-gray-400 font-medium">Autopilot</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="autopilot-toggle" class="sr-only peer">
                <div class="w-9 h-5 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-500"></div>
            </label>
            <div class="flex items-center gap-1 text-gray-500">
                <input type="number" id="autopilot-interval" value="24" min="1" max="168" class="w-12 bg-transparent text-center text-white border-b border-gray-600 focus:border-blue-500 outline-none">
                <span>hrs</span>
            </div>
        </div>

        <!-- Stats Dashboard -->
        <div id="stats-panel" class="flex gap-6 glass-panel px-6 py-2 rounded-full text-sm">
            <div class="flex flex-col items-center">
                <span class="text-gray-400 text-xs">Total Videos</span>
                <span id="stat-total" class="font-semibold text-blue-400">...</span>
            </div>
            <div class="w-px bg-white/10"></div>
            <div class="flex flex-col items-center">
                <span class="text-gray-400 text-xs">Avg View Rate</span>
                <span id="stat-avd" class="font-semibold text-green-400">...</span>
            </div>
            <div class="w-px bg-white/10"></div>
            <div class="flex flex-col items-center">
                <span class="text-gray-400 text-xs">Best Format</span>
                <span id="stat-format" class="font-semibold text-purple-400">...</span>
            </div>
        </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-3xl px-6 z-10 flex flex-col items-center mt-20">

        <h2 class="text-5xl font-medium tracking-tight mb-4 text-center glow-text">Imagine the impossible.</h2>
        <p class="text-gray-400 mb-12 text-center text-lg">Generate high-quality cinematic videos from text or images using SELMA AI.</p>

        <!-- Prompt Bar (Glassmorphism) -->
        <div class="w-full glass-panel rounded-3xl p-2 flex flex-col transition-all duration-300 hover:border-gray-600 focus-within:border-blue-500 shadow-2xl relative" id="prompt-container">

            <form id="generate-form" class="flex flex-col w-full">
                <!-- Text Area -->
                <textarea id="prompt-input" rows="2" class="w-full bg-transparent text-white text-lg px-4 py-3 outline-none resize-none placeholder-gray-500" placeholder="A cinematic drone shot of a cyberpunk city floating in space..."></textarea>

                <!-- Action Row -->
                <div class="flex justify-between items-center px-4 py-2 mt-2">

                    <!-- Controls Group -->
                    <div class="flex items-center gap-4">
                        <!-- Script Provider -->
                        <div class="flex items-center gap-2 text-gray-400 text-sm font-medium border border-white/10 px-3 py-1.5 rounded-full bg-black/20">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            <select id="script-provider" class="bg-transparent outline-none text-white appearance-none cursor-pointer">
                                <option value="selmagpt">SelmaGPT</option>
                                <option value="ollama">Ollama</option>
                                <option value="nvidia">NVIDIA</option>
                                <option value="claude">Claude</option>
                            </select>
                        </div>

                        <!-- Voice Provider -->
                        <div class="flex items-center gap-2 text-gray-400 text-sm font-medium border border-white/10 px-3 py-1.5 rounded-full bg-black/20">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            <select id="voice-provider" class="bg-transparent outline-none text-white appearance-none cursor-pointer">
                                <option value="elevenlabs">ElevenLabs</option>
                                <option value="local_xtts">Local Voice Clone</option>
                            </select>
                        </div>

                        <!-- Voice File Upload (Hidden by default) -->
                        <div id="voice-upload-container" class="hidden items-center">
                            <input type="file" id="voice-upload" class="hidden" accept="audio/*">
                            <button type="button" onclick="document.getElementById('voice-upload').click()" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors text-sm font-medium px-3 py-1.5 rounded-full hover:bg-white/10">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c-1.105 0-2-.895-2-2s.895-2 2-2 2 .895 2 2-.895 2-2 2zm12-3c-1.105 0-2-.895-2-2s.895-2 2-2 2 .895 2 2-.895 2-2 2zM9 10l12-3"></path></svg>
                                <span id="voice-upload-label">Upload Reference Audio</span>
                            </button>
                        </div>

                        <!-- Image Upload -->
                        <div class="flex items-center">
                            <input type="file" id="image-upload" class="hidden" accept="image/*">
                            <button type="button" onclick="document.getElementById('image-upload').click()" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors text-sm font-medium px-3 py-1.5 rounded-full hover:bg-white/10">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <span id="upload-label">Start with Image</span>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submit-btn" class="bg-white text-black px-6 py-2 rounded-full font-semibold hover:bg-gray-200 transition-all transform hover:scale-105 shadow-[0_0_15px_rgba(255,255,255,0.3)] disabled:opacity-50 flex items-center gap-2">
                        <span>Generate</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
        </div>

        <!-- Status & Loader -->
        <div id="status-container" class="hidden w-full mt-8 flex flex-col items-center">
            <div class="relative flex items-center justify-center w-16 h-16 mb-4">
                <div class="absolute w-full h-full rounded-full border-4 border-gray-700 border-t-blue-500 animate-spin"></div>
                <div class="absolute w-12 h-12 rounded-full bg-blue-500/30 animate-ping"></div>
                <div class="absolute w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 shadow-[0_0_15px_rgba(79,172,254,0.8)]"></div>
            </div>
            <p id="status-text" class="text-gray-300 font-medium tracking-wide animate-pulse bg-gradient-to-r from-blue-400 to-purple-400 -webkit-background-clip-text text-transparent">Initializing dream matrix...</p>
        </div>

        <!-- Video Result Gallery -->
        <div id="result-container" class="hidden w-full mt-12 mb-20 animate-fade-in">
            <div class="glass-panel rounded-2xl overflow-hidden aspect-video relative shadow-2xl border border-white/10">
                <video id="result-video" class="w-full h-full object-cover" controls autoplay loop playsinline></video>
                <div class="absolute top-4 left-4 bg-black/50 backdrop-blur px-3 py-1 rounded-full text-xs font-medium border border-white/10 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-400"></span> Generation Complete
                </div>
            </div>
            <p id="result-prompt" class="mt-4 text-gray-400 text-sm px-2 italic"></p>
        </div>

    </div>

    <!-- System Health Panel -->
    <div class="fixed bottom-6 right-6 glass-panel p-4 rounded-2xl flex flex-col gap-2 z-50 text-xs w-64 shadow-2xl">
        <div class="flex items-center justify-between border-b border-white/10 pb-2 mb-1">
            <span class="text-gray-300 font-semibold tracking-wide flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                System Health
            </span>
        </div>
        <div class="flex justify-between items-center">
            <span class="text-gray-500">CPU</span>
            <span id="stat-cpu" class="text-white font-mono">--%</span>
        </div>
        <div class="flex justify-between items-center">
            <span class="text-gray-500">RAM</span>
            <span id="stat-ram" class="text-white font-mono">--%</span>
        </div>
        <div class="flex justify-between items-center">
            <span class="text-gray-500">Disk</span>
            <span id="stat-disk" class="text-white font-mono">--%</span>
        </div>
        <div class="mt-1 pt-2 border-t border-white/10 text-gray-400 font-mono text-[10px]" id="stat-gpu">
            Checking GPU...
        </div>
    </div>

    <script>
        const form = document.getElementById('generate-form');
        const fileInput = document.getElementById('image-upload');
        const uploadLabel = document.getElementById('upload-label');

        const voiceProvider = document.getElementById('voice-provider');
        const voiceUploadContainer = document.getElementById('voice-upload-container');
        const voiceInput = document.getElementById('voice-upload');
        const voiceUploadLabel = document.getElementById('voice-upload-label');

        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        const resultContainer = document.getElementById('result-container');
        const resultVideo = document.getElementById('result-video');
        const resultPrompt = document.getElementById('result-prompt');
        const submitBtn = document.getElementById('submit-btn');

        voiceProvider.addEventListener('change', (e) => {
            if (e.target.value === 'local_xtts') {
                voiceUploadContainer.classList.remove('hidden');
                voiceUploadContainer.classList.add('flex');
            } else {
                voiceUploadContainer.classList.add('hidden');
                voiceUploadContainer.classList.remove('flex');
            }
        });

        voiceInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                voiceUploadLabel.textContent = e.target.files[0].name;
                voiceUploadLabel.classList.add('text-blue-400');
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadLabel.textContent = e.target.files[0].name;
                uploadLabel.classList.add('text-blue-400');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = document.getElementById('prompt-input').value;
            const scriptProvider = document.getElementById('script-provider').value;
            const selectedVoiceProvider = document.getElementById('voice-provider').value;

            if (!prompt && fileInput.files.length === 0) return;

            submitBtn.disabled = true;
            resultContainer.classList.add('hidden');
            statusContainer.classList.remove('hidden');

            const providerName = document.querySelector(`#script-provider option[value="${scriptProvider}"]`).textContent;
            statusText.textContent = `Connecting to ${providerName}...`;

            const formData = new FormData();
            formData.append('prompt', prompt);
            formData.append('script_provider', scriptProvider);
            formData.append('voice_provider', selectedVoiceProvider);
            if (fileInput.files.length > 0) {
                formData.append('image', fileInput.files[0]);
            }
            if (selectedVoiceProvider === 'local_xtts' && voiceInput.files.length > 0) {
                formData.append('voice_file', voiceInput.files[0]);
            }

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                pollStatus(data.job_id, prompt);
            } catch (err) {
                statusText.textContent = "Error: Could not connect to server.";
                submitBtn.disabled = false;
            }
        });

        const autopilotToggle = document.getElementById('autopilot-toggle');
        const autopilotInterval = document.getElementById('autopilot-interval');

        // Fetch Autopilot Status
        async function fetchAutopilotStatus() {
            try {
                const res = await fetch('/api/autopilot/status');
                if (res.ok) {
                    const data = await res.json();
                    autopilotToggle.checked = data.is_running;
                    autopilotInterval.value = data.interval_hours;
                }
            } catch (e) {
                console.error("Could not fetch autopilot status", e);
            }
        }

        // Toggle Autopilot
        autopilotToggle.addEventListener('change', async (e) => {
            autopilotToggle.disabled = true;
            try {
                const res = await fetch('/api/autopilot/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interval_hours: parseInt(autopilotInterval.value) })
                });
                if (res.ok) {
                    const data = await res.json();
                    autopilotToggle.checked = data.is_running;
                    autopilotInterval.value = data.interval_hours;
                }
            } catch (err) {
                console.error("Failed to toggle autopilot", err);
                autopilotToggle.checked = !autopilotToggle.checked; // revert
            } finally {
                autopilotToggle.disabled = false;
            }
        });

        // Polling for System Health
        async function pollSystemHealth() {
            try {
                const res = await fetch('/api/system-metrics');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('stat-cpu').textContent = data.cpu_percent;
                    document.getElementById('stat-ram').textContent = data.ram_percent;
                    document.getElementById('stat-disk').textContent = data.disk_percent;
                    document.getElementById('stat-gpu').textContent = data.gpu_info;
                }
            } catch (e) {
                console.error("Could not fetch system health", e);
            }
        }

        // Fetch stats on load
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('stat-total').textContent = data.total_videos;
                    document.getElementById('stat-avd').textContent = data.avg_view_rate;
                    document.getElementById('stat-format').textContent = data.best_format;
                }
            } catch (e) {
                console.error("Could not fetch stats", e);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchStats();
            pollSystemHealth();
            fetchAutopilotStatus();
            setInterval(pollSystemHealth, 5000);
        });

        const loadingMessages = [
            "Initializing dream matrix...",
            "Synthesizing voice tracks...",
            "Planning cinematic angles...",
            "Composing visual effects...",
            "Rendering final cut..."
        ];

        async function pollStatus(jobId, promptText) {
            let msgIndex = 0;
            const msgInterval = setInterval(() => {
                if(statusContainer.classList.contains('hidden')) {
                    clearInterval(msgInterval);
                    return;
                }
                statusText.textContent = loadingMessages[msgIndex % loadingMessages.length];
                msgIndex++;
            }, 3000);

            const interval = setInterval(async () => {
                const res = await fetch(`/api/status/${jobId}`);
                const data = await res.json();

                // Override our cycling messages with backend real status if available and meaningful
                if (data.message && data.message !== "Görev sıraya alındı...") {
                     statusText.textContent = data.message;
                }

                if (data.status === 'completed') {
                    clearInterval(interval);
                    clearInterval(msgInterval);
                    statusContainer.classList.add('hidden');
                    resultContainer.classList.remove('hidden');
                    resultVideo.src = data.video_url;
                    resultPrompt.textContent = `"${promptText}"`;
                    submitBtn.disabled = false;
                } else if (data.status === 'error') {
                    clearInterval(interval);
                    clearInterval(msgInterval);
                    statusText.textContent = `Error: ${data.message}`;
                    statusText.classList.add('text-red-400');
                    submitBtn.disabled = false;
                }
            }, 2000);
        }
    </script>
</body>
</html>
